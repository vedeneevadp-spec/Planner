def distributionChannel = (project.findProperty('distributionChannel') ?: 'direct').toString()
if (!(distributionChannel in ['direct', 'googlePlay'])) {
    throw new GradleException('distributionChannel must be direct or googlePlay')
}
def signingEnvPrefix = distributionChannel == 'googlePlay' ? 'GOOGLE_PLAY_UPLOAD' : 'ANDROID'
def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file(distributionChannel == 'googlePlay'
    ? 'keystore/google-play-upload/keystore.properties'
    : 'keystore.properties')

if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { stream ->
        releaseSigningProperties.load(stream)
    }
}

def readReleaseSigningValue = { propertyName, envName ->
    def propertyValue = releaseSigningProperties.getProperty(propertyName)

    if (propertyValue != null && !propertyValue.trim().isEmpty()) {
        return propertyValue.trim()
    }

    def envValue = System.getenv(envName)
    return envValue != null && !envValue.trim().isEmpty() ? envValue.trim() : null
}

def resolveReleaseSigningFile = { filePath ->
    if (filePath == null) {
        return null
    }

    def candidate = new File(filePath)
    return candidate.isAbsolute() ? candidate : rootProject.file(filePath)
}

def releaseStoreFilePath = readReleaseSigningValue('storeFile', "${signingEnvPrefix}_KEYSTORE_PATH")
def releaseStorePassword = readReleaseSigningValue('storePassword', "${signingEnvPrefix}_KEYSTORE_PASSWORD")
def releaseKeyAlias = readReleaseSigningValue('keyAlias', "${signingEnvPrefix}_KEY_ALIAS")
def releaseKeyPassword = readReleaseSigningValue('keyPassword', "${signingEnvPrefix}_KEY_PASSWORD")
def hasReleaseSigningConfig = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null }
def androidAbiFilters = (project.findProperty('androidAbiFilters') ?: '')
    .toString()
    .split(',')
    .collect { value -> value.trim() }
    .findAll { value -> !value.isEmpty() }

apply plugin: 'com.android.application'

android {
    namespace = "ru.chaotika.app"
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                storeFile resolveReleaseSigningFile(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    defaultConfig {
        applicationId "ru.chaotika.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 46
        versionName "1.1.39"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        if (!androidAbiFilters.isEmpty()) {
            ndk {
                abiFilters.addAll(androidAbiFilters)
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // Exclude retired local recognition assets even if old ignored files are restored.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:wakewords:*.onnx:*.tflite'
        }
    }
    sourceSets {
        main {
            java.srcDir "src/${distributionChannel}/java"
            if (distributionChannel == 'googlePlay') {
                java.exclude '**/PlannerAppUpdate*.java'
            }
        }
        if (distributionChannel == 'googlePlay') {
            release.manifest.srcFile 'src/googlePlay/AndroidManifest.xml'
            test.java.exclude '**/PlannerAppUpdate*.java'
            androidTest.java.exclude '**/PlannerAppUpdate*.java'
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigningConfig) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Already used by Capacitor Push Notifications; the app now renders task actions.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
def hasGoogleServicesJSON = servicesJSON.exists() && !servicesJSON.text.trim().isEmpty()
def releaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}

if (hasGoogleServicesJSON) {
    apply plugin: 'com.google.gms.google-services'
} else if (releaseBuildRequested) {
    throw new GradleException(
        "android/app/google-services.json is required for release builds because the app registers Firebase push notifications."
    )
} else {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

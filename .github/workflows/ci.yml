name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      - run: node ./scripts/actionlint.mjs

  quality:
    runs-on: ubuntu-latest
    env:
      API_DB_RLS_MODE: transaction_local
      DATABASE_URL: postgres://planner:planner@127.0.0.1:5432/planner_ci
      DB_RUNTIME_DATABASE_URL: postgres://planner_runtime:planner_runtime@127.0.0.1:5432/planner_ci
      TEST_RUNTIME_DATABASE_URL: postgres://planner_runtime:planner_runtime@127.0.0.1:5432/planner_ci
      E2E_API_DATABASE_URL: postgres://planner_runtime:planner_runtime@127.0.0.1:5432/planner_ci

    services:
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_DB: planner_ci
          POSTGRES_PASSWORD: planner
          POSTGRES_USER: planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install pinned npm
        run: |
          npm_version="$(node ./scripts/print-pinned-npm-version.mjs)"
          npm install -g "npm@${npm_version}"
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:security:check
      - run: npm run db:runtime-role:setup
        env:
          DB_RUNTIME_PASSWORD: planner_runtime
      - run: npm run db:security:check
        env:
          DATABASE_URL: postgres://planner_runtime:planner_runtime@127.0.0.1:5432/planner_ci
          DB_SECURITY_REQUIRE_NON_OWNER: '1'
      - run: npm run ci
      - name: Prepare isolated voice migration test database
        run: docker exec "${{ job.services.postgres.id }}" createdb --username planner voice_migration_tests
      - run: npm run test:api:postgres
        env:
          VOICE_REMOVAL_MIGRATION_TEST_DATABASE_URL: postgres://planner:planner@127.0.0.1:5432/voice_migration_tests
      - run: node scripts/api-artifact-smoke.mjs
        env:
          API_AUTH_MODE: jwt
          API_CORS_ORIGIN: http://127.0.0.1:5173
          AUTH_JWT_SECRET: planner-ci-jwt-secret-with-at-least-32-chars
          DATABASE_URL: postgres://planner_runtime:planner_runtime@127.0.0.1:5432/planner_ci
          SMOKE_CLEANUP_DATABASE: '1'
          SMOKE_CLEANUP_DATABASE_URL: postgres://planner:planner@127.0.0.1:5432/planner_ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/pwa-update-smoke.mjs
      - run: npm run test:e2e
      - name: Upload failed E2E traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          if-no-files-found: ignore
          name: e2e-failure-traces
          path: test-results/
          retention-days: 7
      - run: npm run build:analyze
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          if-no-files-found: error
          name: web-bundle-stats
          path: tmp/web-bundle-stats.html
          retention-days: 14

  postgres-17-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_DB_RLS_MODE: transaction_local
      DATABASE_URL: postgres://planner:planner@127.0.0.1:5432/planner_ci

    services:
      postgres:
        # Keep PostgreSQL 17 coverage; the quality job already tests PostgreSQL 18.
        image: postgres:17-alpine
        env:
          POSTGRES_DB: planner_ci
          POSTGRES_PASSWORD: planner
          POSTGRES_USER: planner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install pinned npm
        run: |
          npm_version="$(node ./scripts/print-pinned-npm-version.mjs)"
          npm install -g "npm@${npm_version}"
      - run: npm ci
      - name: Verify PostgreSQL 17 service
        run: |
          server_version="$(
            docker exec "${{ job.services.postgres.id }}" \
              psql --username planner --dbname planner_ci \
              --tuples-only --no-align --command 'show server_version'
          )"
          case "$server_version" in
            17.*) ;;
            *)
              echo "Expected PostgreSQL 17, received $server_version." >&2
              exit 1
              ;;
          esac
      - run: npm run db:migrate
      - run: npm run db:security:check
      - run: npm run db:runtime-role:setup
        env:
          DB_RUNTIME_PASSWORD: planner_runtime
      - run: npm run db:security:check
        env:
          DATABASE_URL: postgres://planner_runtime:planner_runtime@127.0.0.1:5432/planner_ci
          DB_SECURITY_REQUIRE_NON_OWNER: '1'
      - name: Prepare isolated voice migration test database
        run: docker exec "${{ job.services.postgres.id }}" createdb --username planner voice_migration_tests
      - run: npm run test:api:postgres
        env:
          VOICE_REMOVAL_MIGRATION_TEST_DATABASE_URL: postgres://planner:planner@127.0.0.1:5432/voice_migration_tests
      - run: node scripts/api-artifact-smoke.mjs
        env:
          API_AUTH_MODE: jwt
          API_CORS_ORIGIN: http://127.0.0.1:5173
          AUTH_JWT_SECRET: planner-ci-jwt-secret-with-at-least-32-chars
          DATABASE_URL: postgres://planner_runtime:planner_runtime@127.0.0.1:5432/planner_ci
          SMOKE_CLEANUP_DATABASE: '1'
          SMOKE_CLEANUP_DATABASE_URL: postgres://planner:planner@127.0.0.1:5432/planner_ci

  android:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://127.0.0.1:3001
      VITE_AUTH_PROVIDER: planner

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install pinned npm
        run: |
          npm_version="$(node ./scripts/print-pinned-npm-version.mjs)"
          npm install -g "npm@${npm_version}"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci
      - run: npm run mobile:ci-check
      - run: npm run mobile:android:ci
      - name: Enable hardware acceleration for the emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Run native Android instrumentation
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-instrumentation
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  ios:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      MOBILE_ENV_FILE: ''
      VITE_API_BASE_URL: http://127.0.0.1:3001
      VITE_AUTH_PROVIDER: planner

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install pinned npm
        run: |
          npm_version="$(node ./scripts/print-pinned-npm-version.mjs)"
          npm install -g "npm@${npm_version}"
      - run: npm ci
      - run: npm run mobile:ci-check
      - run: npm run mobile:sync:ios
      - name: Verify generated Swift package is up to date
        run: git diff --exit-code -- ios/App/CapApp-SPM/Package.swift
      - run: node scripts/test-ios-auth-rotation.mjs
      - run: npm run mobile:ios:assemble
